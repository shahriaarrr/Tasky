name: CI / CD Pipeline

on:
  push:
    branches:
      - main
      - dev
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64]
    steps:
      - uses: actions/checkout@v4

      - name: Debug matrix variables
        run: echo "🔧 Building for GOOS=${{ matrix.goos }}, GOARCH=${{ matrix.goarch }}"

      - name: Show project tree
        run: |
          echo "📂 Repository structure:"
          ls -R

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build binary
        run: |
          set -euxo pipefail
          mkdir -p build
          BIN=tasky
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          echo "🏗️ Running go build..."
          env GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -x -trimpath -ldflags="-s -w" \
            -o build/${BIN}_${{ matrix.goos }}_${{ matrix.goarch }}${EXT} ./cli/tasky

      - name: Verify build output
        run: |
          echo "✅ Built binaries:"
          ls -lh build

      - name: Compress binary
        run: |
          set -euxo pipefail
          cd build
          BIN=tasky
          FILE="${BIN}_${{ matrix.goos }}_${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            FILE="${FILE}.exe"
            zip -9 "${FILE}.zip" "${FILE}"
            rm "${FILE}"
          else
            tar czf "${FILE}.tar.gz" "${FILE}"
            rm "${FILE}"
          fi
          echo "📦 Archive created:"
          ls -lh

      - name: Upload build artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            build/*.zip
            build/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: build

      - name: List downloaded artifacts
        run: |
          echo "📂 Downloaded artifacts:"
          ls -lhR build

      - name: Generate combined SHA256 checksum
        run: |
          set -euxo pipefail
          cd build
          sha256sum *.{zip,tar.gz} > SHA256SUMS || true
          echo "🔑 SHA256SUMS generated:"
          cat SHA256SUMS

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: build/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
